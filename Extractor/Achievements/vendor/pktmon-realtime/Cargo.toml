[package]
name = "pengo-pktmon-realtime"
version = "0.6.2-pengo.1"
edition = "2024"
rust-version = "1.86"
license = "MIT"
publish = false

[features]
tokio = ["dep:tokio"]

[dependencies]
cidr = "=0.2.3"
log = { version = "=0.4.25", features = ["release_max_level_off"] }
tokio = { version = "=1.45.0", features = ["sync"], optional = true }
windows = { version = "=0.48.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Services",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Time",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
] }
