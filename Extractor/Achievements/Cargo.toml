[package]
name = "pengo-achievements-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
publish = false

[dependencies]
auto-artifactarium = { path = "vendor/auto-artifactarium" }
auto-reliquary = { path = "vendor/auto-reliquary" }
base64 = "=0.22.1"
ctrlc = "=3.4.7"
pengo-pktmon-realtime = { path = "vendor/pktmon-realtime" }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.20.0"
windows = { version = "=0.48.0", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[build-dependencies]
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch."https://github.com/hashblen/mhy-kcp"]
kcp = { path = "vendor/mhy-kcp" }
